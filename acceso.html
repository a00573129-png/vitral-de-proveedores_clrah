<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso · Vitral de Proveedores CLRAH</title>
  <link rel="stylesheet" href="css/clrah.css">
</head>
<body>
  <header class="hdr" id="hdr"></header>

  <main class="pantalla-acceso">
    <div class="panel-acceso">
      <!-- Iniciar sesión -->
      <section data-modo="entrar">
        <h1>Acceso al Vitral</h1>
        <p class="sub">Proveedores registrados y administradores del CLRAH</p>
        <div id="msg-entrar"></div>
        <form id="f-entrar" class="rejilla" novalidate>
          <div class="campo"><label for="e-correo">Correo electrónico</label>
            <input type="email" id="e-correo" name="correo" autocomplete="username" required></div>
          <div class="campo"><label for="e-clave">Contraseña</label>
            <input type="password" id="e-clave" name="clave" autocomplete="current-password" required></div>
          <button class="btn btn-primario" type="submit" style="width:100%;padding:10px">Iniciar sesión</button>
        </form>
        <div class="flex entre mt texto-chico">
          <a href="#" data-ir="recuperar">¿Olvidó su contraseña?</a>
          <a href="registro.html">Registrar mi empresa</a>
        </div>
      </section>

      <!-- Recuperar contraseña -->
      <section data-modo="recuperar" hidden>
        <h1>Recuperar contraseña</h1>
        <p class="sub">Le enviaremos un enlace para crear una contraseña nueva.</p>
        <div id="msg-recuperar"></div>
        <form id="f-recuperar" class="rejilla" novalidate>
          <div class="campo"><label for="r-correo">Correo electrónico</label>
            <input type="email" id="r-correo" name="correo" autocomplete="email" required></div>
          <button class="btn btn-primario" type="submit" style="width:100%;padding:10px">Enviar enlace</button>
        </form>
        <p class="mt texto-chico"><a href="#" data-ir="entrar">Volver a iniciar sesión</a></p>
      </section>

      <!-- Nueva contraseña (al abrir el enlace del correo) -->
      <section data-modo="nueva" hidden>
        <h1>Nueva contraseña</h1>
        <p class="sub">Escriba su nueva contraseña (mínimo 8 caracteres).</p>
        <div id="msg-nueva"></div>
        <form id="f-nueva" class="rejilla" novalidate>
          <div class="campo"><label for="n-clave">Nueva contraseña</label>
            <input type="password" id="n-clave" name="clave" autocomplete="new-password" minlength="8" required></div>
          <div class="campo"><label for="n-clave2">Confirmar contraseña</label>
            <input type="password" id="n-clave2" name="clave2" autocomplete="new-password" required></div>
          <button class="btn btn-primario" type="submit" style="width:100%;padding:10px">Guardar contraseña</button>
        </form>
      </section>
    </div>
  </main>

  <script src="js/vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script type="module" src="js/acceso.js"></script>
</body>
</html>
